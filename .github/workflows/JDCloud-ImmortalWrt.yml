name: JDCloud-ImmortalWrt

on:
  workflow_dispatch:
  workflow_call:
  # schedule:
  #   - cron: 0 20 * * *

env:
  REPO_URL: https://github.com/LiBwrt/LibWrt.git
  REPO_BRANCH: 25.12-nss
  CONFIG_FILE: configs/JDCloud.config

  DIY_SCRIPT: scripts/Roc-script.sh
  CLASH_KERNEL: amd64
  FIRMWARE_TAG: JDCloud
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-24.04

    steps:
    - name: Check Server Performance(检查服务器性能)
      run: |
        echo "警告⚠"
        echo "分配的服务器性能有限，若选择的插件过多，务必注意CPU性能！"
        echo -e "已知CPU型号（降序）：7763，8370C，8272CL，8171M，E5-2673 \n"
        echo "--------------------------CPU信息--------------------------"
        echo "CPU物理数量：$(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU核心信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "--------------------------内存信息--------------------------"
        echo "已安装内存详细信息："
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "--------------------------硬盘信息--------------------------"
        echo "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: Initialization Environment(初始化环境)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update
        sudo -E apt-get -y install $(curl -fsSL ophub.org/ubuntu2404-make-openwrt-depends)
        sudo -E systemctl daemon-reload
        sudo timedatectl set-timezone "$TZ"

    - name: Checkout(检出代码)
      uses: actions/checkout@main

    - name: Clone Source Code(克隆源代码)
      run: |
        df -hT $GITHUB_WORKSPACE
        sudo mkdir -p /mnt/openwrt
        sudo chown -R $(id -u):$(id -g) /mnt/openwrt
        git init --quiet /mnt/openwrt
        git -C /mnt/openwrt remote add origin "$REPO_URL"
        git -C /mnt/openwrt fetch --depth=1 origin "$REPO_BRANCH"
        git -C /mnt/openwrt checkout --quiet --detach FETCH_HEAD
        cd /mnt/openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        echo "REPO_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
        VERSION_INFO=$(git show -s --date=short --format="作者: %an<br/>时间: %cd<br/>内容: %s<br/>hash: %H")
        echo "VERSION_INFO=$VERSION_INFO" >> $GITHUB_ENV
        VERSION_KERNEL=$(grep -oP 'LINUX_KERNEL_HASH-\K[0-9]+\.[0-9]+\.[0-9]+' target/linux/generic/kernel-6.12)
        echo "VERSION_KERNEL=$VERSION_KERNEL" >> $GITHUB_ENV

    - name: Generate Variables(生成变量)
      run: |
        # 确保这里使用的是已经合体后的 $CONFIG_FILE
        cp $CONFIG_FILE $OPENWRT_PATH/.config
        cd $OPENWRT_PATH
        # 执行 defconfig 展开完整的配置树，以便后续 grep 提取变量
        make defconfig > /dev/null 2>&1
        SOURCE_REPO="$(echo $REPO_URL | awk -F '/' '{print $(NF)}')"
        echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_ENV
        DEVICE_TARGET=$(cat .config | grep CONFIG_TARGET_BOARD | awk -F '"' '{print $2}')
        echo "DEVICE_TARGET=$DEVICE_TARGET" >> $GITHUB_ENV
        DEVICE_SUBTARGET=$(cat .config | grep CONFIG_TARGET_SUBTARGET | awk -F '"' '{print $2}')
        echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET" >> $GITHUB_ENV
        echo "HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV
        echo "CACHE_DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV

    - name: Cache Toolchain(缓存工具链)
      uses: actions/cache@main
      with:
        key: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.HASH }} ${{ env.CACHE_DATE }}
        restore-keys: ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-
        path: |
          ${{ env.OPENWRT_PATH }}/.ccache
          ${{ env.OPENWRT_PATH }}/staging_dir

    - name: Refresh The Cache(刷新缓存)
      run: |
        if [ -d "$OPENWRT_PATH/staging_dir" ]; then
          find "$OPENWRT_PATH/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
              find "$dir" -type f -exec touch {} +
          done
        fi

    - name: Install Feeds(安装feeds)
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        FEEDS_VERSION="$(for feed_dir in feeds/*; do
          if git -C "$feed_dir" rev-parse --verify HEAD >/dev/null 2>&1; then
            printf '%s@%s;' "${feed_dir#feeds/}" "$(git -C "$feed_dir" rev-parse HEAD)"
          fi
        done)"
        if [ -z "$FEEDS_VERSION" ]; then
          echo "No feed revisions found after updating feeds" >&2
          exit 1
        fi
        echo "FEEDS_VERSION=$FEEDS_VERSION" >> $GITHUB_ENV
  
    - name: Load Custom Configuration(加载自定义配置)
      run: |
        chmod +x $DIY_SCRIPT
        cd $OPENWRT_PATH
        $GITHUB_WORKSPACE/$DIY_SCRIPT

    - name: Download DL Package(下载DL软件包)
      run: |
        # 直接拷贝合并后的唯一配置文件
        cp $CONFIG_FILE $OPENWRT_PATH/.config
        cd $OPENWRT_PATH
        make defconfig
        make download -j$(nproc)

    - name: Compile Firmware(开始编译固件)如果你用 $(nproc)暴内存的话删掉make -j$(nproc) || 
      id: compile
      run: |
        cd $OPENWRT_PATH
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    - name: Check Space Usage(检查空间使用情况)
      if: (!cancelled())
      run: df -hT

    - name: Organize Files(整理文件)
      if: steps.compile.outputs.status == 'success'
      run: |
        cd $OPENWRT_PATH/bin/targets/*/*
        # 1. 删除所有非 .bin 结尾的文件（保留固件成品）
        # 这里的 find 命令会排除掉文件夹，只删除不是以 .bin 结尾的文件
        find . -maxdepth 1 -type f ! -name "*.bin" -delete
        
        # 2. 如果你连文件夹也不想要，确保当前目录下只有 .bin
        rm -rf packages feeds.buildinfo version.buildinfo sha256sums profiles.json config.buildinfo
        
        # 3. 定义路径，此时路径下仅剩 .bin 文件
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Upload Firmware To Release(发布固件)
      if: steps.compile.outputs.status == 'success'
      uses: ncipollo/release-action@main
      with:
        name: "${{ env.FIRMWARE_TAG }} - ${{ env.FILE_DATE }} (Build #${{ github.run_number }}, attempt ${{ github.run_attempt }})"
        allowUpdates: false
        tag: JDCloud-${{ env.FILE_DATE }}-${{ github.run_number }}-${{ github.run_attempt }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        body: |
          ## Release Notes

          ### 概述
          面向 JDCloud IPQ60xx 设备的定制固件，基于 LiBwrt 构建。以下为本固件包含的功能与构建信息；具体源码更新请参阅下方上游提交记录。

          ### 主要特性
          - **设备支持：** JDCloud RE-SS-01（亚瑟）与 RE-CS-02（雅典娜）
          - **网络加速：** 集成 QCA NSS / ECM 相关组件
          - **代理功能：** HomeProxy（Sing-box），支持 TUN 模式
          - **管理界面：** LuCI Argon 主题
          - **系统工具：** USB 打印与磁盘管理
          - **设备专属功能：** Athena LED 屏幕控制（仅 RE-CS-02）
          - **系统优化：** ZRAM、TCP BBR、irqbalance 与 LTO

          ### 固件信息
          | 项目 | 信息 |
          | --- | --- |
          | 构建时间 | ${{ env.DATE }} |
          | 构建编号 | #${{ github.run_number }} |
          | 运行尝试 | ${{ github.run_attempt }} |
          | 目标平台 | `${{ env.DEVICE_TARGET }}/${{ env.DEVICE_SUBTARGET }}` |
          | 内核版本 | ${{ env.VERSION_KERNEL }} |
          | 固件源码 | [LiBwrt](${{ env.REPO_URL }}) |
          | 源码分支 | `${{ env.REPO_BRANCH }}` |
          | sing-box 版本 | `${{ env.SINGBOX_VERSION }}` |
          | 默认管理地址 | `192.168.2.1` |
          | 默认密码 | 无 |

          ### 下载与安装
          请从本页面的 **Assets** 下载与设备型号对应的 `.bin` 固件。刷机前请确认设备型号及固件类型，并备份配置；不同型号的固件不可混用。

          ### 上游源码记录
          ${{ env.VERSION_INFO }}

          ### 依赖源码版本
          - LiBwrt：[`25.12-nss`](${{ env.REPO_URL }}/commit/${{ env.REPO_COMMIT }}) (`${{ env.REPO_COMMIT }}`)
          - LuCI feeds：`${{ env.FEEDS_VERSION }}`
          - Argon 主题：[`jerrykuku/luci-theme-argon`](https://github.com/jerrykuku/luci-theme-argon/commit/${{ env.ARGON_THEME_COMMIT }}) (`${{ env.ARGON_THEME_COMMIT }}`)
          - Argon 配置：[`jerrykuku/luci-app-argon-config`](https://github.com/jerrykuku/luci-app-argon-config/commit/${{ env.ARGON_CONFIG_COMMIT }}) (`${{ env.ARGON_CONFIG_COMMIT }}`)
          - Golang：[`sbwml/packages_lang_golang`](https://github.com/sbwml/packages_lang_golang/commit/${{ env.GOLANG_COMMIT }}) (`${{ env.GOLANG_COMMIT }}`)
          - HomeProxy：[`immortalwrt/homeproxy`](https://github.com/immortalwrt/homeproxy/commit/${{ env.HOMEPROXY_COMMIT }}) (`${{ env.HOMEPROXY_COMMIT }}`)
          - Athena LED：[`NONGFAH/luci-app-athena-led`](https://github.com/NONGFAH/luci-app-athena-led/commit/${{ env.ATHENA_LED_COMMIT }}) (`${{ env.ATHENA_LED_COMMIT }}`)

    - name: Delete Old Cache(删除旧缓存)
      run: |
        # 获取缓存列表并删除
        gh cache list --key ${{ env.SOURCE_REPO }}-${{ env.REPO_BRANCH }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}- --json key --jq '.[] | .key' | while read -r key; do
          gh cache delete "$key"
        done
        # 输出缓存状态
        echo "========cache status========"
        echo "ccache: $(du -sh $OPENWRT_PATH/.ccache | cut -f 1)"
        echo "staging: $(du -sh $OPENWRT_PATH/staging_dir | cut -f 1)"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete Old Workflows(删除旧工作流)
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        retain_days: 2
        keep_minimum_runs: 0
